<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- ===================== APP SETTINGS: edit these ===================== -->
  <!-- Version: change it when you publish an update.
       It also makes installed phones download a fresh copy of the app. -->
  <meta name="app-version" content="1.0.0">
  <!-- App id: prefix for everything this app stores in the browser, so other
       apps on the same web address don't clash with it. Letters, digits and
       dashes only. Changing it after publishing = users start with empty data. -->
  <meta name="app-id" content="period-tracker">
  <!-- ==================================================================== -->

  <!-- Security: only run scripts from this site; don't tell other sites where users came from -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cycle</title>
  <meta name="description" content="A private period tracker. Your data stays on your phone.">
  <meta name="theme-color" content="#d94a72">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cycle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Today</span>
    </button>
    <button data-tab="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </button>
    <button data-tab="history" aria-label="History">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
      <span>History</span>
    </button>
    <button data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
